# Netlify 설정. 빌드 없이 저장소 루트를 그대로 배포합니다.
# GitHub Pages는 이 파일을 쓰지 않습니다 (Netlify에서만 적용).

[build]
  publish = "."
  command = ""

# 기본 보안 헤더 (모든 주소에 적용)
# Content-Security-Policy: 이 사이트 파일 + 글꼴(cdn.jsdelivr.net)만 허용.
#   외부 이미지·스크립트·글꼴을 새로 쓰게 되면 여기에 주소를 추가해야 화면에 나옵니다.
#   'unsafe-inline'(style)은 화면을 그리는 JS가 style 속성을 쓰기 때문에 필요합니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
